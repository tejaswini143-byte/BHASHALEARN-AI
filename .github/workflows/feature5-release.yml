name: Feature 5 release quality gates

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/feature5-release.yml'
  push:
    branches:
      - 'feature/feature5-phase5-qa-release-20261113'
    paths:
      - 'frontend/**'
      - '.github/workflows/feature5-release.yml'

jobs:
  frontend-unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Verify packages
        run: npm ls react typescript vite three
      - name: All frontend regression tests
        run: npm test
      - name: Production build
        run: npm run build

  frontend-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: npx playwright test e2e/feature5-release.spec.ts
        env:
          CI: 'true'
          BHASHALEARN_E2E_START_SERVERS: '1'
          BHASHALEARN_E2E_MOCK_API: '1'
      - name: Preserve Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature5-playwright-report
          path: |
            frontend/playwright-report-int13/
            frontend/test-results-int13/
          if-no-files-found: ignore
          retention-days: 7
